{% extends "base.html" %}

{% block title %}Application Form - College Admission Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>College Admission Application Form</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <h5 class="mb-4">Personal Information</h5>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="full_name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="dob" class="form-label">Date of Birth *</label>
                            <input type="date" class="form-control" id="dob" name="dob" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="gender" class="form-label">Gender *</label>
                            <select class="form-control" id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required>
                        </div>
                    </div>

                    <h5 class="mb-4 mt-4">Address Information</h5>

                    <div class="mb-3">
                        <label for="address" class="form-label">Street Address *</label>
                        <input type="text" class="form-control" id="address" name="address" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City *</label>
                            <input type="text" class="form-control" id="city" name="city" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="state" class="form-label">State *</label>
                            <input type="text" class="form-control" id="state" name="state" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="zip_code" class="form-label">Zip Code *</label>
                            <input type="text" class="form-control" id="zip_code" name="zip_code" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="country" class="form-label">Country *</label>
                            <input type="text" class="form-control" id="country" name="country" required>
                        </div>
                    </div>

                    <h5 class="mb-4 mt-4">Academic Information</h5>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="program" class="form-label">Program *</label>
                            <select class="form-control" id="program" name="program" required>
                                <option value="">Select Program</option>
                                {% for prog in programs %}
                                <option value="{{ prog.name }}">{{ prog.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="academic_year" class="form-label">Academic Year *</label>
                            <select class="form-control" id="academic_year" name="academic_year" required>
                                <option value="">Select Year</option>
                                <option value="2024-2025">2024-2025</option>
                                <option value="2025-2026">2025-2026</option>
                                <option value="2026-2027">2026-2027</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="gpa" class="form-label">GPA</label>
                            <input type="number" class="form-control" id="gpa" name="gpa" step="0.01" min="0" max="4.0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="entrance_exam_score" class="form-label">Entrance Exam Score</label>
                            <input type="text" class="form-control" id="entrance_exam_score" name="entrance_exam_score">
                        </div>
                    </div>

                    <h5 class="mb-4 mt-4">Additional Information</h5>

                    <div class="mb-3">
                        <label for="extracurricular" class="form-label">Extracurricular Activities</label>
                        <textarea class="form-control" id="extracurricular" name="extracurricular" rows="4"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="essay" class="form-label">Essay / Statement of Purpose</label>
                        <textarea class="form-control" id="essay" name="essay" rows="6"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="documents" class="form-label">Upload Documents (PDF, DOC, DOCX, JPG, PNG)</label>
                        <input type="file" class="form-control" id="documents" name="documents" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        <small class="text-muted">Max file size: 16MB</small>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary btn-lg me-2">Submit Application</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
